<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="styles.css">

<main id="app" class="app"></main>

<!-- 考试时长与录音开关配置：可直接改这个文件，也可在页面「考试设置」里临时调整 -->
